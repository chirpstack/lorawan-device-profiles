[package]
  name = "chirpstack-device-profiles-interface"
  description = "Interface to create and edit ChirpStack device-profiles"
  repository = "https://github.com/chirpstack/chirpstack-device-profiles"
  homepage = "https://www.chirpstack.io/"
  version = "4.0.0"
  authors = ["Orne Brocaar <info@brocaar.com>"]
  edition = "2024"
  publish = false
  license = "MIT"

[dependencies]
  clap = { version = "4.6", features = ["derive"] }
  serde = { version = "1.0", features = ["derive"] }
  serde_valid = "2.0"
  toml = "1.1"
  tonic = "0.14"
  tonic-web = "0.14"
  tonic-prost = "0.14"
  prost = "0.14"
  tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
  futures = "0.3"
  http = "1.5"
  http-body = "1.1"
  pin-project = "1.1"
  tower = "0.5"
  rust-embed = "8.12"
  mime_guess = "2.0"
  axum = "0.8"
  anyhow = "1.0"
  uuid = { version = "1.25", default-features = false, features = [
    "v4",
    "serde",
  ] }
  rquickjs = { version = "0.12", features = ["loader", "array-buffer"] }

[build-dependencies]
  tonic-build = "0.14"
  tonic-prost-build = "0.14"
